name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:20 UTC — look for newly indexed publications.
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh publications from Crossref
        run: python scripts/update_publications.py

      - name: Rebuild the image gallery manifest
        run: python scripts/build_gallery.py

      - name: Commit any new publications
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain index.html data/publications.json js/gallery.js)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html data/publications.json js/gallery.js
            git commit -m "chore: sync publications and gallery"
            git push
          else
            echo "No publication changes."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
